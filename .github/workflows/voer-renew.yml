# Voer.host 免费服务器自动续期
#
# Secrets（Settings → Secrets and variables → Actions）:
#   VOER_SERVER_ID         必须
#   VOER_TOKEN             必须
#   TELEGRAM_BOT_TOKEN     可选
#   TELEGRAM_CHAT_ID       可选
#
# 还需要: Settings → Actions → General → Workflow permissions → Read and write

name: Voer.host 会话续期

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: "renew"
        type: choice
        options:
          - renew
          - power-on
          - status

  schedule:
    # 会被「更新下次运行 Cron」步骤按 session 到期时间自动改写
    - cron: "0 0,8,16 * * *"

concurrency:
  group: voer-renew
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-liberation libnss3 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libasound2t64 2>/dev/null || \
          sudo apt-get install -y -qq xvfb fonts-liberation libnss3 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libasound2

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright Chromium
        run: playwright install chromium --with-deps

      - name: 检查 Secrets
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_TOKEN: ${{ secrets.VOER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$VOER_SERVER_ID" ] || [ -z "$VOER_TOKEN" ]; then
            echo "缺少 VOER_SERVER_ID 或 VOER_TOKEN"
            exit 1
          fi
          echo "VOER_SERVER_ID len=${#VOER_SERVER_ID}"
          echo "VOER_TOKEN len=${#VOER_TOKEN}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram: configured"
          else
            echo "Telegram: not configured (optional)"
          fi

      - name: 只查看状态
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'status'
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_TOKEN: ${{ secrets.VOER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python3 voer_renew.py --status

      - name: 执行续期
        if: |
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'renew')
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_TOKEN: ${{ secrets.VOER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VOER_NEXT_RUN_LEAD_MINUTES: "45"
        run: |
          set -o pipefail
          xvfb-run -a python3 voer_renew.py 2>&1 | tee renew_output.log

      - name: 只尝试开机
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'power-on'
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_TOKEN: ${{ secrets.VOER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VOER_NEXT_RUN_LEAD_MINUTES: "45"
        run: |
          set -o pipefail
          xvfb-run -a python3 voer_renew.py --power-on 2>&1 | tee renew_output.log

      - name: 上传截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: |
            debug_screenshot.png
            renew_screenshot.png
          if-no-files-found: ignore

      - name: 再次确认状态
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'status'))
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_TOKEN: ${{ secrets.VOER_TOKEN }}
        run: xvfb-run -a python3 voer_renew.py --status || true

      - name: 更新下次运行 Cron
        if: success()
        run: |
          set -e
          WF=".github/workflows/voer-renew.yml"

          if [ ! -f next_run.txt ] && [ -f renew_output.log ]; then
            grep -oE 'NEXT_RUN_UTC=[0-9T:Z-]+' renew_output.log | tail -1 > next_run.txt || true
            # 从日志 "cron: M H D m *" 提取
            CRON_LINE=$(grep -oE 'cron: [0-9]+ [0-9]+ [0-9]+ [0-9]+ \*' renew_output.log | tail -1 | sed 's/^cron: //' || true)
            if [ -n "$CRON_LINE" ]; then
              echo "NEXT_RUN_CRON=$CRON_LINE" >> next_run.txt
            fi
          fi

          if [ ! -f next_run.txt ]; then
            echo "无 next_run.txt，跳过 cron 更新"
            exit 0
          fi

          echo "----- next_run.txt -----"
          cat next_run.txt

          NEXT_RUN_UTC=$(grep '^NEXT_RUN_UTC=' next_run.txt | head -1 | cut -d= -f2- | tr -d '\r')
          NEXT_RUN_CRON=$(grep '^NEXT_RUN_CRON=' next_run.txt | head -1 | cut -d= -f2- | tr -d '\r')

          if [ -z "$NEXT_RUN_UTC" ] || [ -z "$NEXT_RUN_CRON" ]; then
            echo "NEXT_RUN 字段不完整，跳过"
            exit 0
          fi

          echo "下次运行 UTC: $NEXT_RUN_UTC"
          echo "新 cron: $NEXT_RUN_CRON"

          python3 << 'PY'
          import pathlib
          import re

          wf = pathlib.Path(".github/workflows/voer-renew.yml")
          text = wf.read_text(encoding="utf-8")
          nxt = pathlib.Path("next_run.txt").read_text(encoding="utf-8")

          cron = iso = None
          for line in nxt.splitlines():
              if line.startswith("NEXT_RUN_CRON="):
                  cron = line.split("=", 1)[1].strip()
              if line.startswith("NEXT_RUN_UTC="):
                  iso = line.split("=", 1)[1].strip()

          if not cron:
              raise SystemExit("no cron in next_run.txt")

          # 只替换 schedule 下的 cron 值
          pattern = r'(schedule:\s*\n\s*-\s*cron:\s*")([^"]+)(")'
          new_text, n = re.subn(pattern, r"\g<1>" + cron + r"\g<3>", text, count=1)
          if n != 1:
              pattern2 = r"(schedule:\s*\n\s*-\s*cron:\s*')([^']+)(')"
              new_text, n = re.subn(pattern2, r"\g<1>" + cron + r"\g<3>", text, count=1)
          if n != 1:
              raise SystemExit(f"failed to patch cron line, matches={n}")

          # 去掉旧的 auto 注释，追加新注释
          new_text = re.sub(
              r'(cron:\s*"' + re.escape(cron) + r'")\s*#.*',
              r'\1',
              new_text,
              count=1,
          )
          new_text = re.sub(
              r'(cron:\s*"' + re.escape(cron) + r'")',
              r'\1  # auto next: ' + (iso or "") + " UTC",
              new_text,
              count=1,
          )

          if new_text == text:
              print("cron unchanged")
              pathlib.Path("/tmp/cron_changed").write_text("0")
          else:
              wf.write_text(new_text, encoding="utf-8")
              pathlib.Path("/tmp/cron_changed").write_text("1")
              print("workflow cron updated")

          print(f"NEXT_RUN_UTC={iso}")
          print(f"NEXT_RUN_CRON={cron}")
          PY

          if [ "$(cat /tmp/cron_changed 2>/dev/null || echo 0)" != "1" ]; then
            echo "无需推送"
            exit 0
          fi

          git config user.name "voer-renew-bot"
          git config user.email "voer-renew-bot@users.noreply.github.com"
          git add "$WF"
          if git diff --cached --quiet; then
            echo "无变更"
            exit 0
          fi
          git commit -m "chore: auto cron next run ${NEXT_RUN_UTC}"
          git push
          echo "Cron 已推送"
